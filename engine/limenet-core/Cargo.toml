[package]
name = "limenet-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental LimeNet VLESS TCP core"

[[bin]]
name = "limenet-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26"
webpki-roots = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
rcgen = "0.13"
